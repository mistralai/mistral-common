name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'no-pr' }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

# Publishing to GitHub Pages is deactivated; this workflow only validates that the
# documentation builds. Re-enable publishing by restoring the artifact upload and
# deploy-pages steps on push to main.
jobs:
  build_docs:
    name: Build docs
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras --group docs

      - name: Generate code reference pages
        run: uv run python docs/gen_api_pages.py

      - name: Build documentation
        run: uv run zensical build
