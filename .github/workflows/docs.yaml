name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Manual publish, e.g. for a release tag:
  #   gh workflow run docs.yaml --ref main -f ref=v1.13.1
  # The github-pages environment only accepts deployments from main (and gh-pages).
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch or SHA) to build the docs from; empty = the dispatched ref"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

# Automatic publishing to GitHub Pages is deactivated: PRs and pushes to main only
# validate that the documentation builds. Publishing happens on manual dispatch only.
jobs:
  build_docs:
    name: Build docs
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras --group docs

      - name: Generate code reference pages
        run: uv run python docs/gen_api_pages.py

      - name: Build documentation
        run: uv run zensical build

      - name: Archive site
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: tar -cvf "$RUNNER_TEMP/artifact.tar" -C ./site --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy_docs:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build_docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
