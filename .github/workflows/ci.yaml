name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# we cancel all runs of previous commits in PR. On main we run the CI on all commits
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'no-pr' }}
  cancel-in-progress: ${{ github.event.pull_request.number != null }}

jobs:
  # static_checks builds and caches one .venv per Python version; the test jobs then run
  # in parallel on all Python versions and restore that same cached environment.
  static_checks:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support all LTS versions of Python
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.15",
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check uv lock
        run: |
          uv lock --check

      - name: Cache uv environment
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Dependencies
        run: |
          uv sync --frozen --all-extras --group dev --group test-integrations

      # Ruff Linter
      - name: Ruff Linter
        run: |
          uv run ruff check .

      # Ruff Format
      - name: Ruff Format
        run: |
          uv run ruff format . --check

      # Mypy
      - name: Mypy Check
        run: |
          uv run mypy .

  unit_tests:
    if: ${{ github.event.pull_request.draft != true }}
    needs: static_checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support all LTS versions of Python
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.15",
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Dependencies
        run: |
          uv sync --frozen --all-extras --group dev --group test-integrations

      # PyTest
      - name: Tests
        run: |
          uv run pytest --cov=mistral_common tests/ --ignore=tests/integration -n auto --dist loadfile --cov-report "xml:coverage.xml"

      # Doctests
      - name: Doctests
        run: |
          uv run pytest --doctest-modules ./src

  integration_tests:
    if: ${{ github.event.pull_request.draft != true }}
    needs: static_checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Support all LTS versions of Python
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14",
          "3.15",
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Dependencies
        run: |
          uv sync --frozen --all-extras --group dev --group test-integrations

      # The pinned revisions and digests live in the provisioning script, so its hash keys the cache;
      # restored files are still size- and SHA-256-checked by the script before tests run.
      - name: Cache Test Tokenizers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/test-tokenizers
          key: test-tokenizers-${{ hashFiles('tests/integration/provision_tokenizers.py') }}

      - name: Provision Test Tokenizers
        run: |
          uv run --no-sync python tests/integration/provision_tokenizers.py

      - name: Integration Tests
        run: |
          HF_HUB_OFFLINE=1 uv run --no-sync pytest tests/integration/ -n auto --dist loadfile -v

