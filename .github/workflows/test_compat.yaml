name: Downstream Compatibility

permissions:
  contents: read

# Runs targeted downstream tokenization test suites (vLLM, Transformers) against
# the mistral-common version in this repo whenever the PR carries the
# `run-downstream-tests` label (label added, or new push while labeled), or on
# manual dispatch. CPU only, no GPU required.
on:
  pull_request:
    types:
      - labeled
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  # Every lane runs through scripts/run_downstream_tests.py, exactly as locally,
  # against the latest released vLLM and Transformers. One matrix entry per lane
  # keeps them parallel and reports each lane's result separately. The script
  # installs into ephemeral environments and needs only Python, uv and git.
  # The labels come from the event payload, which lists the PR's current labels on
  # both `labeled` and `synchronize` events, so no API call or token is needed.
  downstream:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-downstream-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [ours-vllm, ours-transformers, upstream-vllm, upstream-transformers]
    steps:
      - name: Checkout mistral-common
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Run downstream lane
        run: python3 scripts/run_downstream_tests.py --only ${{ matrix.lane }}
