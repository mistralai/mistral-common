name: Downstream Compatibility

permissions:
  contents: read

# Runs targeted downstream tokenization test suites (vLLM, Transformers) against
# the mistral-common version in this repo whenever the PR carries the
# `run-downstream-tests` label (label added, or new push while labeled), or on
# manual dispatch. CPU only, no GPU required.
on:
  pull_request:
    types:
      - labeled
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if PR carries the run-downstream-tests label
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
              --jq 'any(.[]; .name == "run-downstream-tests")' | grep -q true; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "PR does not carry the run-downstream-tests label, skipping."
          fi

  # Keep vLLM and Transformers in parallel jobs; the script supplies each
  # suite's released checkout and invokes the same steps used locally.
  downstream:
    needs: gate
    if: ${{ needs.gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: [vllm, transformers]
    steps:
      - name: Checkout mistral-common
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Run upstream Mistral compatibility suite
        run: python3 scripts/run_downstream_tests.py ${{ matrix.suite }}
