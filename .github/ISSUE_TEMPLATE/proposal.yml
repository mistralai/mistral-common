name: Problem or feature proposal
description: Explain a problem, feature idea, or documentation improvement
title: '[PROPOSAL]: '
labels: ['triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve mistral-common!

        Please search the existing issues before submitting a new one. If an issue already covers the topic, add your context there instead of opening a duplicate. For a reproducible bug, you may also use the bug report template.
  - type: dropdown
    id: type
    attributes:
      label: Proposal type
      options:
        - Problem or bug not covered by the bug report template
        - Feature request
        - Documentation improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem you are facing, the use case, or the improvement you would like to discuss.
      placeholder: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior or result you would expect.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include examples, links, versions, constraints, or other relevant details.
  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested solution
      description: If you have an implementation idea, describe it briefly. A solution is not required.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I have searched the existing issues.
          required: true
        - label: I understand that discussion should happen in an issue before implementation begins.
          required: true
